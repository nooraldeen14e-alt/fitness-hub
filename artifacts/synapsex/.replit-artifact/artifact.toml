kind = "web"
previewPath = "/synapsex/"
title = "SynapseX — Neural AI Landing Site"
description = "A single-page cinematic landing site for SynapseX, a futuristic neural-AI interface product. Full-viewport video backgrounds, mouse-scrubbed hero video, scramble text animations, and scroll-driven 3D effects. Pure frontend, no backend."
version = "1.0.0"
id = "artifacts/synapsex"
router = "path"

[[services]]
name = "web"
paths = [ "/synapsex/" ]
localPort = 23935

[services.development]
run = "pnpm --filter @workspace/synapsex run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/synapsex", "run", "build" ]
serve = "static"
publicDir = "artifacts/synapsex/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23935"
BASE_PATH = "/synapsex/"
