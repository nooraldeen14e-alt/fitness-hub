[build]
  command = "pnpm --filter @workspace/fitness-app run build"
  publish = "artifacts/fitness-app/dist/public"
  functions = "artifacts/fitness-app/netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
